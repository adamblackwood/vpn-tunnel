name: Shift 5 (V2.0 - Auto-Recovery)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  shift-5:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Cloudflared & Xray
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip -d xray
          chmod +x xray/xray

      - name: Create Xray Config
        run: |
          cat > config.json <<EOF
          { "inbounds": [{"port": 8080,"listen": "127.0.0.1","protocol": "vless","settings": {"clients": [{"id": "7dcf879a-148c-4399-b220-d68f78440e3d","level": 0}],"decryption": "none"},"streamSettings": {"network": "ws","wsSettings": {"path": "/ws"}}}], "outbounds": [{"protocol": "freedom"}] }
          EOF

      - name: Check Duplicate & Take Shift
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git pull --rebase || true
          CURRENT_TIME=$(date +%s)
          ACTIVE="none"
          HEARTBEAT=0
          
          if [ -f state.json ]; then
            ACTIVE=$(grep -o '"active_shift": "[^"]*"' state.json | cut -d'"' -f4 || true)
            HEARTBEAT=$(grep -o '"heartbeat": [0-9]*' state.json | grep -o '[0-9]*' || true)
            if [ -z "$ACTIVE" ]; then ACTIVE="none"; fi
            if [ -z "$HEARTBEAT" ]; then HEARTBEAT=0; fi
          fi
          
          if [ "$ACTIVE" == "shift-5" ] && [ $((CURRENT_TIME - HEARTBEAT)) -lt 120 ]; then
            echo "DUPLICATE=true" >> $GITHUB_ENV
            MESSAGE="⚠️ *تنبيه: تم محاولة تشغيل الوردية 5 وهي تعمل بالفعل!*
            تم تجاهل الطلب المكرر لمنع التعارض."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MESSAGE}" -d parse_mode="Markdown"
          else
            echo "DUPLICATE=false" >> $GITHUB_ENV
            echo "{\"active_shift\": \"shift-5\", \"next_shift\": \"shift-6\", \"heartbeat\": $CURRENT_TIME}" > state.json
            git add state.json
            git commit -m "Shift 5 started" || true
            git push || true
          fi

      - name: Start Servers
        if: env.DUPLICATE == 'false'
        run: |
          ./xray/xray -config=config.json &
          /usr/local/bin/cloudflared tunnel --url http://localhost:8080 --no-autoupdate > tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' tunnel.log | head -n 1)
          HOST=$(echo $TUNNEL_URL | sed 's/https:\/\///')
          echo "HOST=$HOST" >> $GITHUB_ENV

      - name: Send Telegram (Start) & Save Message ID
        if: env.DUPLICATE == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          START_HM=$(TZ='Asia/Aden' date +"%H:%M")
          END_HM=$(TZ='Asia/Aden' date -d "+5 hours 30 minutes" +"%H:%M")
          
          MESSAGE="🟠 *الوردية 5 بدأت!*
          🕒 من: ${START_HM} إلى: ${END_HM} (5.5 ساعات إجبارية)
          🔗 *Host:* \`${{ env.HOST }}\`"
          
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          -d chat_id="${TELEGRAM_CHAT_ID}" \
          -d text="${MESSAGE}" \
          -d parse_mode="Markdown")
          
          MSG_ID=$(echo "$RESPONSE" | grep -o '"message_id":[0-9]*' | cut -d':' -f2)
          echo "MSG_ID=$MSG_ID" >> $GITHUB_ENV
          echo "$MSG_ID" > msg_id.txt

      - name: Keep Alive (5.5 Hours Enforced)
        if: env.DUPLICATE == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          START_TIME=$(date +%s)
          MAX_DURATION=$((5 * 3600 + 1800))
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            git pull --rebase || true
            ACTIVE=$(grep -o '"active_shift": "[^"]*"' state.json | cut -d'"' -f4 || true)
            
            if [ "$ACTIVE" == "shift-5" ]; then
              HEARTBEAT_TIME=$(date +%s)
              echo "{\"active_shift\": \"shift-5\", \"next_shift\": \"shift-6\", \"heartbeat\": $HEARTBEAT_TIME}" > state.json
              git add state.json
              git commit -m "Shift 5 heartbeat" || true
              git push || true
            fi
            
            if [ "$ELAPSED" -ge "$MAX_DURATION" ]; then
              MSG_ID=$(cat msg_id.txt)
              
              if [ "$ACTIVE" != "shift-6" ]; then
                MESSAGE="🟠 *تنبيه: الوردية 5 انتهت، والوردية 6 لم تبدأ بعد!*
                جارٍ التدخل وتشغيل الوردية 6 يدوياً..."
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MESSAGE}" -d parse_mode="Markdown" -d reply_to_message_id="$MSG_ID"
                
                curl -s -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $GITHUB_TOKEN" \
                https://api.github.com/repos/${{ github.repository }}/actions/workflows/shift-6.yml/dispatches \
                -d '{"ref":"main"}'
                
                sleep 60
              fi
              
              MESSAGE="🔴 *الوردية 5 اكتملت (5.5 ساعات) وتتوقف الآن.*
              تم التأكد من تشغيل الوردية التالية بنجاح ✅"
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d text="${MESSAGE}" -d parse_mode="Markdown" -d reply_to_message_id="$MSG_ID"
              break
            fi
            
            sleep 60
          done
